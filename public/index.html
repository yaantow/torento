<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torento</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a href="/" class="logo">Torento</a>
    <div class="search-area">
      <input type="text" id="searchInput" placeholder="Search movies, shows..." autocomplete="off">
      <select id="sourceSelect">
        <option value="all">All Sources</option>
        <option value="yts">YTS</option>
        <option value="x1337">1337x</option>
        <option value="tpb">TPB</option>
        <option value="tgx">TorrentGalaxy</option>
      </select>
      <button id="searchBtn">Search</button>
      <button id="viewToggleBtn" class="view-toggle-btn hidden" title="List view">&#9776;</button>
      <button id="magnetToggle" class="magnet-toggle" title="Stream from magnet link">&#128279;</button>
      <button id="queueNavBtn" class="queue-nav-btn" title="Queue">&#128190; <span id="queueCount" class="queue-count hidden"></span></button>
    </div>
    <div id="magnetBar" class="magnet-bar hidden">
      <input type="text" id="magnetInput" class="magnet-input" placeholder="Paste magnet link and press Enter...">
      <button id="magnetBtn" class="magnet-btn">Stream</button>
    </div>
    <div id="cacheStatus" class="cache-status">
      <span id="cacheLabel"></span>
      <div class="cache-bar" id="cacheBar"><div class="cache-bar-fill" id="cacheBarFill"></div></div>
    </div>
  </header>

  <main>
    <div id="home" class="home-section">
      <div id="continueWatching" class="continue-watching hidden">
        <h2>Continue Watching</h2>
        <div id="continueList" class="continue-list"></div>
      </div>
      <div id="watchLaterHome" class="continue-watching hidden">
        <h2>Watch Later</h2>
        <div id="watchLaterHomeList" class="continue-list"></div>
      </div>
      <div id="localCache" class="continue-watching hidden">
        <h2>Local Cache</h2>
        <div id="localCacheList" class="cache-files-list"></div>
      </div>
      <div id="partialsInfo" class="continue-watching hidden">
        <h2>Partial Downloads <span id="partialsSize"></span></h2>
        <div id="partialsList" class="cache-files-list"></div>
        <button id="cleanPartialsBtn" class="action-btn primary" style="margin-top:8px;">Clean Orphaned Partials</button>
      </div>
      <div id="downloadsHome" class="continue-watching hidden">
        <h2>Downloads</h2>
        <div id="downloadsHomeList" class="downloads-list"></div>
      </div>
      <div id="recentSearches" class="recent-searches hidden">
        <h2>Recent Searches</h2>
        <div id="recentList" class="recent-list"></div>
      </div>
      <div id="homePlaceholder" class="placeholder">
        <h2>Welcome to Torento</h2>
        <p>Search for movies and shows to start streaming</p>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <p>Searching...</p>
    </div>

    <div id="errors" class="errors hidden"></div>

    <div id="gallery" class="gallery hidden"></div>
    <div id="listView" class="list-view hidden"></div>

    <div id="detail" class="detail hidden">
      <button class="back-btn" id="backBtn">&larr; Back to results</button>
      <div id="detailContent"></div>
    </div>

    <div id="player" class="player hidden">
      <button class="back-btn" id="playerBack">&larr; Back</button>
      <div id="playerTitle" class="player-title"></div>
      <div class="player-wrapper">
        <video id="videoPlayer" controls crossorigin playsinline></video>
      </div>
      <div class="player-actions">
        <button id="downloadBtn" class="action-btn hidden">Download</button>
        <button id="copyLinkBtn" class="action-btn hidden">Copy Stream Link</button>
      </div>
      <div id="torrentStatus" class="torrent-status"></div>
    </div>

    <div id="magnetDetail" class="magnet-detail hidden">
      <button class="back-btn" id="magnetBack">&larr; Back</button>
      <h2 class="magnet-title">Torrent Files</h2>
      <div id="magnetDetailContent"></div>
    </div>

    <div id="queuePage" class="queue-page hidden">
      <button class="back-btn" id="queueBack">&larr; Back</button>
      <h2 style="font-size:1.2rem;font-weight:600;margin-bottom:14px;">Download Queue</h2>
      <div id="queueList" class="torrent-list"></div>
    </div>
  </main>

  <footer>
    <span id="footerCache"></span>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="/app.js"></script>
</body>
</html>
